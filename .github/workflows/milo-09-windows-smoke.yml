name: Milo 0.9 Windows desktop smoke

on:
  push:
    branches:
      - feature/milo-09-desktop-awareness
    paths:
      - "colibri/milo_core/**"
      - "desktop/**"
      - "tests/test_milo*.py"
      - ".github/workflows/milo-09-windows-smoke.yml"
  pull_request:
    paths:
      - "colibri/milo_core/**"
      - "desktop/**"
      - "tests/test_milo*.py"
      - ".github/workflows/milo-09-windows-smoke.yml"

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install "cryptography>=42,<51" "Pillow>=11,<13" "pypdf>=5,<7" "python-docx>=1.1,<2" "tkinterdnd2==0.7.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile core and desktop UI
        shell: pwsh
        run: |
          python -m compileall -q colibri/milo_core desktop/milo_desktop.py desktop/screen_capture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Milo regressions
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_milo*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Tk quick-chat and activity smoke
        shell: pwsh
        run: |
          python -m desktop.milo_desktop --ui-self-test
          if ($LASTEXITCODE -ne 0) {
            $trace = Join-Path $env:TEMP "milo-ui-diagnostics.log"
            if (Test-Path $trace) { Get-Content $trace | Select-Object -Last 100 | Write-Host }
            throw "Milo 0.9 desktop UI smoke failed"
          }
